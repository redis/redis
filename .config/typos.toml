# See https://github.com/crate-ci/typos/blob/master/docs/reference.md to configure typos

[files]
extend-exclude = [
    "deps/",
    # crc16_slottable is primarily pre-generated random strings.
    "src/crc16_slottable.h",
    # Third-party imported code.
    "src/pqsort.c",
    "src/lzf_c.c",
    "src/lzf_d.c",
    "src/lzf.h",
    "src/sha1.c",
]

[default.extend-words]
exat = "exat"
optin = "optin"
smove = "smove"

[default]
extend-ignore-re = [
    'WATCHed',
    'SELECTed',
    'RESTOREd',
    'DUMPed',

    # Italian poetry in lolwut8.c.
    'le cose',

    # ANSI escape sequences inside redis-cli reverse-search test regexes
    # (e.g. `k\x1B[1mey\x1B[0m`).
    '\[1mey',
]

[default.extend-identifiers]
# POSIX glob struct field; not a typo.
gl_pathc = "gl_pathc"
# Existing Redis identifiers preserved to avoid sweeping renames.
hnswSerNode = "hnswSerNode"
HNSW_SER_WORSTLINK_MISSING = "HNSW_SER_WORSTLINK_MISSING"
keyMetaClassSer = "keyMetaClassSer"

[type.c]
extend-ignore-re = [
    "Georg Nees",
    "\\[l\\]ist", # eval.c
]

[type.tcl]
extend-ignore-re = [
    "DUMPed",
]

[type.c.extend-identifiers]
clen = "clen"
fle = "fle"
nd = "nd"
ot = "ot"
# Local variable abbreviations widespread across the codebase.
cpy = "cpy"
pn = "pn"
# Latency-tracking subsystem identifiers.
advices = "advices"
# t_string GETRANGE/SETRANGE locals.
arange_start = "arange_start"
arange_end = "arange_end"

[type.tcl.extend-identifiers]
fo = "fo"
oll = "oll"

[type.sv.extend-words]
# sv = .h
fo = "fo"
seeked = "seeked"

[type.c.extend-words]
fo = "fo"
seeked = "seeked"
tre = "tre"
pn = "pn"

[type.systemd.extend-words]
# systemd = .conf
ake = "ake"

[type.tcl.extend-words]
fo = "fo"
tre = "tre"
