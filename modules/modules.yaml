# modules.yaml — release manifest for bundled Redis modules.
#
# Single source of truth for which upstream repo and ref each module is
# pinned to. Consumed by:
#   - `make modules-update` (top-level Makefile) to clone/refresh sources
#     under modules/<name>/src/
#   - `modules/docker-install-bundled-module-deps.sh` (Docker image build
#     only; see docker/Dockerfile.noble) to run each module's install_script.sh
#   - modules/common.mk's per-module clone-on-build fallback
#   - `make tarball` to clone modules at their pinned ref into the
#     release source tarball
#
# Ref selection — each module is pinned to exactly one of:
#   tag:    <git tag>      preferred for releases (immutable)
#   branch: <git branch>   for feature work / floating refs
#   commit: <full SHA>     for exact pinning when no tag exists
#   version: <ref>         legacy alias for `tag` (still accepted)
#
# Priority when more than one is set: tag > version > branch > commit.
# `version` is treated as an alias for `tag` and shares its priority tier.
# At least one of these must be set; otherwise modules-update / build will
# error loudly.
#
# To bump a module: edit the appropriate field and run
# `make modules-update <name>` to refresh the local clone.
#
# Format (kept deliberately simple so a small awk helper can parse it without
# needing yq/python; see modules/manifest.mk):
#   modules:
#     - name: <module-name>            # directory under modules/
#       repo: <git URL>
#       tag:    <tag-or-empty>         # optional
#       branch: <branch-or-empty>      # optional
#       commit: <sha-or-empty>         # optional
#       version: <legacy-alias>        # optional; treated as `tag`
#       target_module: <path>          # build artifact path relative to
#                                      # src/bin/<os>-<arch>-release/ (i.e.
#                                      # the .so the upstream build produces).
#                                      # Examples: `redisbloom.so`,
#                                      # `search-community/redisearch.so`.
#       loadmodule: <path-to-.so>      # used by `make modules-update` to
#                                      # rewrite the auto-managed block in
#                                      # redis.conf; the .so basename does not
#                                      # always match the module name (e.g.
#                                      # redisjson produces rejson.so).
#
# Notes:
#   - `vector-sets` is intentionally absent — it lives in-tree under
#     modules/vector-sets/ and is not cloned.
#   - No inline comments after values; one field per line.

modules:
  - name: redisbloom
    repo: https://github.com/redisbloom/redisbloom
    tag:
    branch: make_setup_with_redis_docker
    commit:
    version:
    target_module: redisbloom.so
    loadmodule: ./modules/redisbloom/redisbloom.so
  - name: redisearch
    repo: https://github.com/redisearch/redisearch
    tag: v8.7.90
    branch:
    commit:
    version:
    target_module: search-community/redisearch.so
    loadmodule: ./modules/redisearch/redisearch.so
  - name: redisjson
    repo: https://github.com/redisjson/redisjson
    tag:
    branch:
    commit:
    version: make_set_tup_with_redis_dockers
    target_module: rejson.so
    loadmodule: ./modules/redisjson/rejson.so
  - name: redistimeseries
    repo: https://github.com/redistimeseries/redistimeseries
    tag:
    branch: make_set_up_new_with_redis_dockers
    commit:
    version:
    target_module: redistimeseries.so
    loadmodule: ./modules/redistimeseries/redistimeseries.so
