name: "Codecov"

# Enabling on each push is to display the coverage changes in every PR, 
# where each PR needs to be compared against the coverage of the head commit
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-coverage:
    if: ${{ github.repository == 'redis/redis' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install lcov and run test
      run: |
        sudo apt-get install lcov
        make lcov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./src/redis.info
        disable_search: true
        fail_ci_if_error: true

  code-coverage-32bit:
    if: ${{ github.repository == 'redis/redis' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build and test 32-bit bitmap enumeration
      run: |
        sudo apt-get update
        sudo apt-get install -y libc6-dev-i386 gcc-multilib lcov tcl8.6 tclx
        make gcov CFLAGS='-m32' LDFLAGS='-m32' MALLOC=libc SKIP_VEC_SETS=yes
        ./runtest --single unit/bitroar --only '/^(BITRANGEINTARRAY|Integer-array)' --clients 1 --verbose --dump-logs
        cd src
        geninfo --rc geninfo_unexecuted_blocks=1 -o redis.info .

    # Merge both reports for this commit to cover the 32-bit LONG_MAX guard.
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        name: 32bit
        files: ./src/redis.info
        disable_search: true
        fail_ci_if_error: true

