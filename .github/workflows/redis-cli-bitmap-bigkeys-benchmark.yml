name: redis-cli bitmap bigkeys benchmark

on:
  pull_request:
    branches: [unstable]
    paths:
      - src/redis-cli.c
      - src/bitops.c
      - src/bitroar.c
      - tests/integration/redis-cli.tcl
      - tests/benchmarks/redis-cli-bitmap-bigkeys.sh
      - .github/workflows/redis-cli-bitmap-bigkeys-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # This workflow is also exercised by the upstream native-bitmap PR,
      # whose base does not support native bitmaps. Compare against the last
      # feature-capable revision before redis-cli learned bitmap cardinality.
      - name: Check out regression baseline
        env:
          BASE_SHA: d3b6669f755a08001e0135829a7036c4e4774a00
        run: git worktree add /tmp/redis-benchmark-baseline "$BASE_SHA"

      - name: Build baseline and head
        run: |
          make -C /tmp/redis-benchmark-baseline -j2
          make -j2

      - name: Measure bitmap cardinality scan cost
        run: |
          value() {
            sed -n "s/.*$1=\\([^ ]*\\).*/\\1/p"
          }

          baseline_samples=()
          head_samples=()
          for sample in 1 2 3; do
            if (( sample % 2 == 1 )); then
              baseline_result=$(tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
                /tmp/redis-benchmark-baseline/src/redis-server \
                /tmp/redis-benchmark-baseline/src/redis-cli)
              head_result=$(tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
                "$PWD/src/redis-server" "$PWD/src/redis-cli")
            else
              head_result=$(tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
                "$PWD/src/redis-server" "$PWD/src/redis-cli")
              baseline_result=$(tests/benchmarks/redis-cli-bitmap-bigkeys.sh \
                /tmp/redis-benchmark-baseline/src/redis-server \
                /tmp/redis-benchmark-baseline/src/redis-cli)
            fi
            baseline_sample=$(value elapsed_ms <<<"$baseline_result")
            head_sample=$(value elapsed_ms <<<"$head_result")
            if [[ ! "$baseline_sample" =~ ^[0-9]+$ || ! "$head_sample" =~ ^[0-9]+$ ]]; then
              echo "Could not parse benchmark sample" >&2
              exit 1
            fi
            baseline_samples+=("$baseline_sample")
            head_samples+=("$head_sample")
          done

          median() {
            local sorted
            local middle
            mapfile -t sorted < <(printf '%s\n' "$@" | sort -n)
            middle=$((${#sorted[@]} / 2))
            printf '%s\n' "${sorted[$middle]}"
          }
          baseline_ms=$(median "${baseline_samples[@]}")
          head_ms=$(median "${head_samples[@]}")
          baseline_total=$(value bitmap_total <<<"$baseline_result")
          head_total=$(value bitmap_total <<<"$head_result")
          head_count=$(value bitmap_count <<<"$head_result")
          head_unit=$(value unit <<<"$head_result")
          expected_total=$(value expected_total <<<"$head_result")

          for metric in "$baseline_ms" "$head_ms" "$baseline_total" "$head_total" "$head_count" "$expected_total"; do
            if [[ ! "$metric" =~ ^[0-9]+$ ]]; then
              echo "Could not parse benchmark result" >&2
              exit 1
            fi
          done

          delta_ms=$((head_ms - baseline_ms))
          {
            echo '## redis-cli native-bitmap big-key benchmark'
            echo
            echo '| Revision | Scan duration | Reported cardinality |'
            echo '|---|---:|---:|'
            echo "| Pre-cardinality baseline | ${baseline_ms} ms | ${baseline_total} |"
            echo "| PR head | ${head_ms} ms | ${head_total} set bits |"
            echo
            echo "Fixture: 20,000 native bitmap keys, including 1,000 with 32 sparse containers."
            echo "Baseline samples: ${baseline_samples[*]} ms. Head samples: ${head_samples[*]} ms."
            echo "Median head-minus-baseline scan delta: ${delta_ms} ms."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "baseline: $baseline_result"
          echo "head: $head_result"

          if [[ "$head_count" != 20000 || "$head_total" != "$expected_total" || "$head_unit" != set_bits ]]; then
            echo "Head did not report the expected native-bitmap cardinality" >&2
            exit 1
          fi

          # BITCOUNT adds real work, but it should stay within a generous bound
          # that catches accidental serial scans or other pathological changes.
          if (( head_ms > baseline_ms * 2 + 500 )); then
            echo "Bitmap cardinality scan exceeded the CI performance budget" >&2
            exit 1
          fi
