name: Cuckoo

on:
  push:
    paths:
      - 'src/probabilistic/cuckoo/**'
      - 'src/probabilistic/utils/**'
  pull_request:
    paths:
      - 'src/probabilistic/cuckoo/**'
      - 'src/probabilistic/utils/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cuckoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6 tclx
          python -m pip install -r tests/bloom/requirements.txt
      - name: Build
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror -DREDIS_TEST'
      - name: C unit tests
        run: |
          src/redis-server test murmurhash --accurate
          src/redis-server test cuckoo --accurate
          src/redis-server test cuckoo-object --accurate
      - name: Core integration tests
        run: ./runtest --single unit/cuckoo --single unit/hyperloglog --verbose --dump-logs
      - name: Cuckoo Python tests
        run: ./runtest-cuckoo
