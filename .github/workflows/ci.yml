name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes
    - name: test
      run: |
        sudo apt-get install tcl8.6 tclx
        ./runtest --verbose --tags -slow --dump-logs
    - name: validate commands.def up to date
      run: |
        touch src/commands/ping.json
        make commands.def
        dirty=$(git diff)
        if [[ ! -z  $dirty ]]; then echo $dirty; exit 1; fi

  test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: make
        # build with TLS module just for compilation coverage
        run: make SANITIZER=address REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST' BUILD_TLS=module
      - name: testprep
        run: sudo apt-get install tcl8.6 tclx -y
      - name: test
        run: ./runtest --verbose --tags -slow --dump-logs

  fuzz:
    name: Fuzz Testing - ${{ matrix.fuzzer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fuzzer: fuzz_string_commands
            corpus: string_commands
          - fuzzer: fuzz_bitmap_commands
            corpus: bitmap_commands
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Generate fuzzing seeds
        run: |
          fuzz/generate-seeds.sh
          git diff --exit-code -- fuzz/corpus
      - name: Build fuzzers
        run: make fuzz CC=clang -j"$(nproc)"
      - name: Restore reusable fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz-corpus-cache/${{ matrix.fuzzer }}
          key: fuzz-corpus-${{ matrix.fuzzer }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.fuzzer }}-${{ github.ref_name }}-
            fuzz-corpus-${{ matrix.fuzzer }}-
      - name: Prepare fuzz corpus
        run: |
          mkdir -p "fuzz-corpus/${{ matrix.fuzzer }}"
          cp -R "fuzz/corpus/${{ matrix.corpus }}/." "fuzz-corpus/${{ matrix.fuzzer }}/"
          if [ -d "fuzz-corpus-cache/${{ matrix.fuzzer }}" ]; then
            cp -R "fuzz-corpus-cache/${{ matrix.fuzzer }}/." "fuzz-corpus/${{ matrix.fuzzer }}/"
          fi
      - name: Run Fuzzing - ${{ matrix.fuzzer }}
        run: |
          export ASAN_OPTIONS=detect_leaks=0:allocator_may_return_null=1:malloc_limit_mb=2048
          "fuzz/${{ matrix.fuzzer }}" \
            "fuzz-corpus/${{ matrix.fuzzer }}" \
            -artifact_prefix=./ \
            -max_total_time=60 \
            -timeout=30 \
            -rss_limit_mb=2048 \
            -max_len=4096
      - name: Minimize fuzz corpus
        if: always()
        run: |
          export ASAN_OPTIONS=detect_leaks=0:allocator_may_return_null=1:malloc_limit_mb=2048
          rm -rf "fuzz-corpus-minimized/${{ matrix.fuzzer }}"
          mkdir -p "fuzz-corpus-minimized/${{ matrix.fuzzer }}"
          "fuzz/${{ matrix.fuzzer }}" \
            -merge=1 \
            "fuzz-corpus-minimized/${{ matrix.fuzzer }}" \
            "fuzz-corpus/${{ matrix.fuzzer }}"
      - name: Collect fuzz artifacts
        if: always()
        run: |
          mkdir -p "fuzz-artifacts/${{ matrix.fuzzer }}"
          if [ -d "fuzz-corpus-minimized/${{ matrix.fuzzer }}" ]; then
            cp -R "fuzz-corpus-minimized/${{ matrix.fuzzer }}" "fuzz-artifacts/${{ matrix.fuzzer }}/corpus"
          fi
          shopt -s nullglob
          for pattern in crash-* leak-* timeout-* oom-* slow-unit-*; do
            for file in $pattern; do
              cp "$file" "fuzz-artifacts/${{ matrix.fuzzer }}/"
            done
          done
      - name: Save minimized fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz-corpus-minimized/${{ matrix.fuzzer }}
          key: fuzz-corpus-${{ matrix.fuzzer }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.fuzzer }}-artifacts
          path: fuzz-artifacts/${{ matrix.fuzzer }}
          if-no-files-found: ignore

  build-debian-old:
    runs-on: ubuntu-latest
    container: debian:buster
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
        sed -i 's|http://security.debian.org|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
        apt-get update && apt-get install -y build-essential
        make REDIS_CFLAGS='-Werror'

  build-macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes

  build-32bit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sudo apt-get update && sudo apt-get install libc6-dev-i386 gcc-multilib
        make REDIS_CFLAGS='-Werror' 32bit

  build-libc-malloc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: make REDIS_CFLAGS='-Werror' MALLOC=libc

  build-centos-jemalloc:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        dnf -y install which gcc make
        make REDIS_CFLAGS='-Werror'

  build-old-chain-jemalloc:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        apt-get update
        apt-get install -y gnupg2
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial main" >> /etc/apt/sources.list
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial universe" >> /etc/apt/sources.list
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 40976EAF437D05B5
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3B4FE6ACC0B21F32
        apt-get update
        apt-get install -y make gcc-4.8
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
        make CC=gcc REDIS_CFLAGS='-Werror'
