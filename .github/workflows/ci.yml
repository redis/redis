name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes
    - name: test
      run: |
        sudo apt-get install tcl8.6 tclx
        ./runtest --verbose --tags -slow --dump-logs
    - name: validate commands.def up to date
      run: |
        touch src/commands/ping.json
        make commands.def
        dirty=$(git diff)
        if [[ ! -z  $dirty ]]; then echo $dirty; exit 1; fi

  test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: make
        # build with TLS module just for compilation coverage
        run: make SANITIZER=address REDIS_CFLAGS='-Werror -DDEBUG_ASSERTIONS -DREDIS_TEST' BUILD_TLS=module
      - name: testprep
        run: sudo apt-get install tcl8.6 tclx -y
      - name: test
        run: ./runtest --verbose --tags -slow --dump-logs

  test-big-endian-bitmap-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: build and test native bitmap persistence on s390x
        run: |
          docker run --rm --platform linux/s390x \
            -v "$PWD:/workspace:ro" \
            -w /redis \
            debian:bookworm \
            bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates procps tcl8.6 tclx
              cp -a /workspace/. /redis
              make -j2 REDIS_CFLAGS="-Werror" MALLOC=libc
              ./runtest --verbose --single unit/bitmap-native-type --dump-logs
              ./runtest --verbose --single integration/corrupt-dump --only "/^corrupt payload: bitmap" --dump-logs
            '

  test-redis-roaring-migrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Checkout redis-roaring
        uses: actions/checkout@v6
        with:
          repository: aviggiano/redis-roaring
          path: redis-roaring
      - name: Build Redis
        run: make -j"$(nproc)" REDIS_CFLAGS='-Werror' MALLOC=libc
      - name: Build redis-roaring module
        run: |
          git -C redis-roaring submodule update --init --recursive deps/CRoaring deps/hiredis
          (
            cd redis-roaring/src
            ../deps/CRoaring/amalgamation.sh
          )
          cmake -S redis-roaring -B redis-roaring/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ROARING_TESTS=OFF \
            -DDISABLE_TESTS=ON
          cmake --build redis-roaring/build --target redis-roaring --parallel "$(nproc)"
          module_path="$(find "$GITHUB_WORKSPACE/redis-roaring/build" -type f -name 'libredis-roaring*.so' | head -n 1)"
          test -n "$module_path"
          echo "REDIS_ROARING_MODULE=$module_path" >> "$GITHUB_ENV"
      - name: Run redis-roaring migrator integration
        run: |
          python3 -m py_compile tools/redis-bitmap-migrate.py tests/integration/redis-bitmap-migrate.py
          mkdir -p "$RUNNER_TEMP/croaring-realdata"
          REDIS_SERVER="$GITHUB_WORKSPACE/src/redis-server" \
          REDIS_ROARING_MODULE="$REDIS_ROARING_MODULE" \
          REDIS_DOWNLOAD_CROARING_REALDATA=1 \
          REDIS_CROARING_REALDATA_DIR="$RUNNER_TEMP/croaring-realdata" \
            python3 tests/integration/redis-bitmap-migrate.py

  build-debian-old:
    runs-on: ubuntu-latest
    container: debian:buster
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
        sed -i 's|http://security.debian.org|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
        apt-get update && apt-get install -y build-essential
        make REDIS_CFLAGS='-Werror'

  build-macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      # Fail build if there are warnings
      # build with TLS just for compilation coverage
      run: make REDIS_CFLAGS='-Werror' BUILD_TLS=yes

  build-32bit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        sudo apt-get update && sudo apt-get install libc6-dev-i386 gcc-multilib
        make REDIS_CFLAGS='-Werror' 32bit

  build-libc-malloc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: make REDIS_CFLAGS='-Werror' MALLOC=libc

  build-centos-jemalloc:
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        dnf -y install which gcc make
        make REDIS_CFLAGS='-Werror'

  build-old-chain-jemalloc:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v6
    - name: make
      run: |
        apt-get update
        apt-get install -y gnupg2
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial main" >> /etc/apt/sources.list
        echo "deb http://archive.ubuntu.com/ubuntu/ xenial universe" >> /etc/apt/sources.list
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 40976EAF437D05B5
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3B4FE6ACC0B21F32
        apt-get update
        apt-get install -y make gcc-4.8
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
        make CC=gcc REDIS_CFLAGS='-Werror'
