name: test-pr-15816

on:
  # This workflow is intentionally limited to the maintainer-owned temporary
  # branch used to validate PR #15816 without updating the unstable branch.
  push:
    branches:
      - test-pr-15816

jobs:
  redis_docs_sync_test:
    if: github.repository == 'redis/redis'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          # The GitHub App must be installed on redis/docs.
          owner: redis
          repositories: docs
          permission-actions: write

      - name: Invoke workflow on redis/docs
        env:
          # GitHub App token used to dispatch the workflow in redis/docs.
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          # The current repository token used to read releases from redis/redis.
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NAME=$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${RELEASE_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/redis/redis/releases/latest \
              | jq -er '.tag_name'
          )

          echo "Triggering redis/docs with release: ${RELEASE_NAME}"

          gh workflow run \
            -R redis/docs \
            redis_docs_sync.yaml \
            -f release="${RELEASE_NAME}"
