name: Post-Release Automation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 7.2.0)'
        required: true
        type: string

jobs:
  extract-release-info:
    if: github.repository == 'redis/redis' || github.repository == 'm-marinov/redis'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-info.outputs.tag_name }}
      release_type: ${{ steps.release-info.outputs.release_type }}
    steps:
      - name: Extract and validate release information
        id: release-info
        env:
          TAG_NAME: ${{ inputs.version_tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG_NAME}"

          LATEST_TAG=$(gh release view --json tagName --jq '.tagName')
          echo "Latest release tag: ${LATEST_TAG}"

          if [[ "${TAG_NAME}" == "${LATEST_TAG}" ]]; then
            echo "release_type=latest" >> $GITHUB_OUTPUT
            echo "Detected latest release: ${TAG_NAME}"
          else
            echo "release_type=non-latest" >> $GITHUB_OUTPUT
            echo "Detected non-latest release: ${TAG_NAME} (latest is ${LATEST_TAG})"
          fi

  create-tarball:
    needs: extract-release-info
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.extract-release-info.outputs.tag_name }}
          fetch-depth: 0

      - name: Create tarball
        run: ./utils/releasetools/01_create_tarball.sh "${{ needs.extract-release-info.outputs.tag_name }}"

      - name: Verify tarball size
        run: |
          TARBALL="/tmp/redis-${{ needs.extract-release-info.outputs.tag_name }}.tar.gz"
          SIZE_MB=$(du -m "$TARBALL" | cut -f1)
          echo "Tarball size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 3 ] || [ "$SIZE_MB" -gt 5 ]; then
            echo "Warning: Tarball size ${SIZE_MB} MB is outside expected range (3-5 MB)"
          fi

      - name: Calculate SHA256 checksum
        id: checksum
        run: |
          TARBALL="/tmp/redis-${{ needs.extract-release-info.outputs.tag_name }}.tar.gz"
          SHA256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)
          echo "SHA256: $SHA256"
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v6
        with:
          name: redis-${{ needs.extract-release-info.outputs.tag_name }}-tarball
          path: /tmp/redis-${{ needs.extract-release-info.outputs.tag_name }}.tar.gz
          compression-level: 0

  approval-gate:
    needs: [extract-release-info, create-tarball]
    if: needs.extract-release-info.outputs.release_type == 'latest'
    runs-on: ubuntu-latest
    steps:
      - name: Approval gate
        run: |
          echo "TODO: Implement approval gate"

  upload-tarball:
    needs: [extract-release-info, approval-gate]
    if: ${{ !cancelled() && (needs.approval-gate.result == 'success' || needs.approval-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload tarball
        run: |
          echo "TODO: Implement tarball upload"

  test-release-tarball:
    needs: upload-tarball
    runs-on: ubuntu-latest
    steps:
      - name: Test release tarball
        run: |
          echo "TODO: Implement release testing"

  update-release-hashes:
    needs: test-release-tarball
    runs-on: ubuntu-latest
    steps:
      - name: Update release hashes
        run: |
          echo "TODO: Implement hash update"

  summary-and-notify:
    needs: [extract-release-info, create-tarball, update-release-hashes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Post-Release Automation Summary"
            echo ""
            echo "- **Release Tag:** ${{ needs.extract-release-info.outputs.tag_name }}"
            echo "- **Release Type:** ${{ needs.extract-release-info.outputs.release_type }}"
            echo "- **SHA256:** ${{ needs.create-tarball.outputs.sha256 }}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification
        run: |
          echo "TODO: Implement Slack notification"
