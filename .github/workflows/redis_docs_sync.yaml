name: redis_docs_sync

on:
  release:
    types: [published]

jobs:
  redis_docs_sync:
    if: github.repository == 'redis/redis'
    # GITHUB_TOKEN is used below to read releases from redis/redis
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          # The GitHub App must be installed on redis/docs
          owner: redis
          repositories: docs
          permission-actions: write

      - name: Invoke workflow on redis/docs
        env:
          # GitHub App token for dispatching the workflow in redis/docs.
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          # The current repository token for reading redis/redis releases.
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.event.release.tag_name }}
        run: |
          LATEST_RELEASE=$(
              curl -Ls \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${RELEASE_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/redis/redis/releases/latest \
              | jq -r '.tag_name'
          )

          if [[ "${LATEST_RELEASE}" == "${RELEASE_NAME}" ]]; then
            gh workflow run -R redis/docs redis_docs_sync.yaml -f release="${RELEASE_NAME}"
          fi
