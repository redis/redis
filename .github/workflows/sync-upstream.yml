name: Sync Upstream Redis

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/redis/redis.git
          git fetch upstream unstable

      - name: Check for new commits
        id: check
        run: |
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/unstable)
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Already up to date with upstream"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Found $BEHIND_COUNT new commits from upstream"
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND_COUNT: ${{ steps.check.outputs.behind_count }}
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH_NAME"
          git merge upstream/unstable --no-edit
          git push origin "$BRANCH_NAME"

          # Generate commit list for PR body
          COMMIT_LIST=$(git log --oneline origin/unstable..HEAD | head -50)

          # Create PR
          gh pr create \
            --title "Sync upstream Redis - $(date +%Y-%m-%d)" \
            --body "## Upstream Sync

          This PR brings in the latest changes from [redis/redis](https://github.com/redis/redis) unstable branch.

          **Commits behind:** ${BEHIND_COUNT}

          ### Changes from upstream
          \`\`\`
          ${COMMIT_LIST}
          \`\`\`

          ---
          *This PR was automatically generated by the sync-upstream workflow.*" \
            --base unstable \
            --head "$BRANCH_NAME"
